# Based on the instructions at https://github.com/bazel-contrib/publish-to-bcr
# This BCR publication workflow is deliberately triggered manually via
# workflow_dispatch. It is not called by the release workflow.
name: "Publish on Bazel Central Registry"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: filmil/bazel-central-registry
      attest: true
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
